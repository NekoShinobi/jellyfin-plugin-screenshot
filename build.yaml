overview: "Adds a screenshot button to the video player OSD. Captures the current frame via FFmpeg and downloads it as JPEG."
description: >
  Provides a native screenshot capture button in the Jellyfin video player.
  When clicked, the current playback position is sent to the server, which
  uses FFmpeg to extract the exact frame from the source file and returns it
  as a JPEG image download. No client-side canvas compression — pixel-perfect
  frame from the original media.
