name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      changelog:
        description: Release notes for the GitHub release and Jellyfin manifest
        required: true
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install FFmpeg for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Check frontend syntax
        run: |
          node --check Jellyfin.Plugin.Screenshot/js/screenshot.js
          node --check Jellyfin.Plugin.Screenshot/js/clipping.js

      - name: Calculate build version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          base_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Directory.Build.props must contain a four-part numeric Version." >&2
            exit 1
          fi

          version="${base_version%.*}.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Screenshot Capture $version"

      - name: Build and package both server versions
        env:
          SCREENSHOT_FFMPEG: /usr/bin/ffmpeg
          SCREENSHOT_FFPROBE: /usr/bin/ffprobe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for jellyfin_version in 10.11.0 12.0.0; do
            base_version="$(dotnet msbuild Jellyfin.Plugin.Screenshot/Jellyfin.Plugin.Screenshot.csproj \
              -p:JellyfinVersion="$jellyfin_version" -getProperty:Version)"
            version="${base_version%.*}.${GITHUB_RUN_NUMBER}"
            package_dir="$RUNNER_TEMP/plugin-$jellyfin_version"
            dotnet build -c Release \
              -p:JellyfinVersion="$jellyfin_version" \
              -p:Version="$version" \
              -p:AssemblyVersion="$version" \
              -p:FileVersion="$version" \
              -p:PluginPackageDir="$package_dir"

            dotnet test tests/Jellyfin.Plugin.Screenshot.Tests -c Release \
              -p:JellyfinVersion="$jellyfin_version"

            archive="Jellyfin.Plugin.Screenshot_${version}.zip"
            test -f "$package_dir/Jellyfin.Plugin.Screenshot.dll"
            jq -e --arg version "$version" --arg abi "$jellyfin_version.0" \
              '.version == $version and .targetAbi == $abi' "$package_dir/meta.json"
            (cd "$package_dir" && zip -r "$GITHUB_WORKSPACE/dist/$archive" .)
            checksum="$(md5sum "dist/$archive" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
            printf '%s  %s\n' "$checksum" "$archive" > "dist/$archive.md5"
          done

      - name: Upload release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: screenshot-capture-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CHANGELOG: ${{ inputs.changelog || github.event.head_commit.message || format('Automated release for {0}', github.sha) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Download release artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: screenshot-capture-${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.zip dist/*.zip.md5 --clobber
            gh release edit "$VERSION" --title "$VERSION" --notes "$CHANGELOG"
          else
            gh release create "$VERSION" \
              dist/*.zip dist/*.zip.md5 \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "$CHANGELOG"
          fi

      - name: Add release to plugin manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          for archive_path in dist/*.zip; do
            archive="$(basename "$archive_path")"
            metadata="$(unzip -p "$archive_path" meta.json)"
            version="$(jq -r '.version' <<< "$metadata")"
            target_abi="$(jq -r '.targetAbi' <<< "$metadata")"
            checksum="$(cut -d ' ' -f 1 "$archive_path.md5")"
            source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${archive}"
            timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            updated_manifest="$(mktemp)"

            jq \
              --arg version "$version" \
              --arg targetAbi "$target_abi" \
              --arg checksum "$checksum" \
              --arg sourceUrl "$source_url" \
              --arg timestamp "$timestamp" \
              --arg changelog "$CHANGELOG" \
              '.[0].versions |= ([{
                changelog: $changelog,
                targetAbi: $targetAbi,
                version: $version,
                sourceUrl: $sourceUrl,
                checksum: $checksum,
                timestamp: $timestamp
              }] + map(select(.version != $version)))' \
              manifest.json > "$updated_manifest"
            mv "$updated_manifest" manifest.json
          done

      - name: Commit plugin manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: add $VERSION to plugin manifest [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
